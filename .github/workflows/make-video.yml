name: 영상 만들기 (영문 Map of War)

# map-of-war는 영문 전용 저장소 — 한 번 실행 = 영문 에피소드 1편 렌더링
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "에피소드 폴더 이름 (episodes/ 아래. 예: ep08-chosin)"
        default: "ep08-chosin"
        required: true
      mode:
        description: "full = 최종 MP4 / preview = 재료+미리보기만 / free = 무료 점검 / check = API 점검 / scout = 사진 후보 수집 / thumb = 썸네일 그림 생성+렌더링만"
        type: choice
        options: [full, preview, free, check, scout, thumb]
        default: full
      english:
        description: "(사용 안 함 — 예전 호환용)"
        type: boolean
        default: false
      redo:
        description: "다시 만들 재료 (쉼표로: tts,photos,ai,sfx,geo) — 비우면 바뀐 것만"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: make-video-${{ github.event.inputs.episode }}
  cancel-in-progress: false

jobs:
  en:
    uses: ./.github/workflows/render-episode.yml
    with:
      episode: ${{ github.event.inputs.episode }}
      mode: ${{ github.event.inputs.mode }}
      redo: ${{ github.event.inputs.redo }}
    secrets: inherit
